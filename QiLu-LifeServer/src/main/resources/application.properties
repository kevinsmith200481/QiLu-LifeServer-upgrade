rpc.name=qilu-life-server
rpc.serverHost=localhost
rpc.serverPort=8092
rpc.connectTimeoutMs=1000
# The transport budget must match the documented main-service RPC budget.
# A lower value would cut off native Function Calling before Provider returns.
rpc.requestTimeoutMs=52000
rpc.maxAttempts=3
rpc.retryIntervalMs=100
campus.sms.mode=${CAMPUS_SMS_MODE:logging}
# Set campus.sms.mode=http and configure endpoint/auth/template fields to send real SMS codes.
# The HTTP sender posts JSON: phone, code, templateId, signName, accessKey, secretKey.
campus.sms.endpoint=${CAMPUS_SMS_ENDPOINT:}
campus.sms.auth-header-name=${CAMPUS_SMS_AUTH_HEADER_NAME:}
campus.sms.auth-header-value=${CAMPUS_SMS_AUTH_HEADER_VALUE:}
campus.sms.access-key=${CAMPUS_SMS_ACCESS_KEY:}
campus.sms.secret-key=${CAMPUS_SMS_SECRET_KEY:}
campus.sms.template-id=${CAMPUS_SMS_TEMPLATE_ID:}
campus.sms.sign-name=${CAMPUS_SMS_SIGN_NAME:}
campus.sms.success-keyword=${CAMPUS_SMS_SUCCESS_KEYWORD:}
campus.sms.connect-timeout-millis=${CAMPUS_SMS_CONNECT_TIMEOUT_MILLIS:3000}
campus.sms.read-timeout-millis=${CAMPUS_SMS_READ_TIMEOUT_MILLIS:5000}
