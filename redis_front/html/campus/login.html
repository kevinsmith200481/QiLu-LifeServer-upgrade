<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&#x767B;&#x5F55; - &#x9F50;&#x9C81;&#x6821;&#x56ED;&#x670D;&#x52A1;</title>
  <link rel="stylesheet" href="./css/campus.css?v=20260624-login1">
</head>
<body class="login-page">
<div id="app" class="login-shell" v-cloak>
  <main class="login-card" aria-labelledby="login-title">
    <div class="brand login-brand">
      <span class="brand-mark" aria-hidden="true">QL</span>
      <span>
        <strong>&#x9F50;&#x9C81;&#x6821;&#x56ED;&#x670D;&#x52A1;</strong>
        <small>&#x8D26;&#x53F7;&#x767B;&#x5F55;</small>
      </span>
    </div>

    <section class="page-heading">
      <p class="eyebrow">&#x6821;&#x56ED;&#x670D;&#x52A1;&#x5DE5;&#x4F5C;&#x53F0;</p>
      <h1 id="login-title">&#x767B;&#x5F55;&#x5DE5;&#x4F5C;&#x53F0;</h1>
      <p>&#x4F7F;&#x7528;&#x624B;&#x673A;&#x53F7;&#x548C;&#x5BC6;&#x7801;&#x8FDB;&#x5165;&#x6821;&#x56ED;&#x670D;&#x52A1;&#x5DE5;&#x4F5C;&#x53F0;&#x3002;</p>
    </section>

    <status-banner :message="message" :type="messageType" :busy="submitting"></status-banner>

    <form class="login-form" novalidate @submit.prevent="submitLogin">
      <div class="field" :class="{'has-error': errors.phone}">
        <label for="phone">&#x624B;&#x673A;&#x53F7;<span>*</span></label>
        <input
          id="phone"
          v-model.trim="form.phone"
          inputmode="tel"
          autocomplete="username"
          maxlength="11"
          placeholder="13686869696"
          @blur="validateField('phone')"
        >
        <small v-if="errors.phone" class="field-error">{{ errors.phone }}</small>
      </div>

      <div class="field" :class="{'has-error': errors.password}">
        <label for="password">&#x5BC6;&#x7801;<span>*</span></label>
        <input
          id="password"
          v-model.trim="form.password"
          type="password"
          autocomplete="current-password"
          maxlength="32"
          placeholder="123456"
          @blur="validateField('password')"
        >
        <small v-if="errors.password" class="field-error">{{ errors.password }}</small>
      </div>

      <button class="button full-width" type="submit" :disabled="submitting">
        {{ submitting ? "\u767b\u5f55\u4e2d" : "\u767b\u5f55" }}
      </button>
    </form>

    <div class="login-demo">
      <span class="badge">&#x6F14;&#x793A;&#x8D26;&#x53F7;</span>
      <button class="button secondary" type="button" :disabled="submitting" @click="useDemo('admin')">&#x7BA1;&#x7406;&#x5458;</button>
      <button class="button secondary" type="button" :disabled="submitting" @click="useDemo('manager')">&#x7F51;&#x70B9;&#x7BA1;&#x7406;&#x5458;</button>
      <button class="button secondary" type="button" :disabled="submitting" @click="useDemo('student')">&#x5B66;&#x751F;</button>
    </div>
  </main>
</div>

<script src="/js/vendor/vue.js"></script>
<script src="/js/vendor/axios.min.js"></script>
<script src="./js/campus-common.js?v=20260702-error-cn1"></script>
<script src="./js/campus-components.js?v=20260629-cn1"></script>
<script>
  new Vue({
    el: "#app",
    data() {
      return {
        submitting: false,
        message: "\u8bf7\u8f93\u5165\u8d26\u53f7\u4fe1\u606f\u3002",
        messageType: "info",
        form: {
          phone: "",
          password: ""
        },
        errors: {}
      };
    },
    mounted() {
      if (campusApi.getToken()) {
        this.goRedirect();
      }
    },
    methods: {
      validateField(field) {
        const errors = Object.assign({}, this.errors);
        const phone = this.form.phone || "";
        const password = this.form.password || "";

        if (!field || field === "phone") {
          if (!phone) {
            errors.phone = "\u8bf7\u8f93\u5165\u624b\u673a\u53f7\u3002";
          } else if (!/^1([38][0-9]|4[579]|5[0-3,5-9]|6[6]|7[0135678]|9[89])\d{8}$/.test(phone)) {
            errors.phone = "\u624b\u673a\u53f7\u683c\u5f0f\u4e0d\u6b63\u786e\u3002";
          } else {
            delete errors.phone;
          }
        }

        if (!field || field === "password") {
          if (!password) {
            errors.password = "\u8bf7\u8f93\u5165\u5bc6\u7801\u3002";
          } else if (!/^\w{4,32}$/.test(password)) {
            errors.password = "\u5bc6\u7801\u9700\u4e3a 4-32 \u4f4d\u5b57\u6bcd\u3001\u6570\u5b57\u6216\u4e0b\u5212\u7ebf\u3002";
          } else {
            delete errors.password;
          }
        }

        this.errors = errors;
        return Object.keys(errors).length === 0;
      },
      async submitLogin() {
        if (!this.validateField()) {
          this.notify("\u8bf7\u5148\u4fee\u6b63\u767b\u5f55\u8868\u5355\u3002", "error");
          return;
        }

        this.submitting = true;
        this.notify("\u6b63\u5728\u767b\u5f55\u3002", "info");
        try {
          await campusApi.login({
            phone: this.form.phone,
            password: this.form.password
          });
          this.notify("\u767b\u5f55\u6210\u529f\uff0c\u6b63\u5728\u8df3\u8f6c\u3002", "info");
          this.goRedirect();
        } catch (error) {
          this.notify(String(error), "error");
        } finally {
          this.submitting = false;
        }
      },
      useDemo(type) {
        const phones = {
          admin: "13686869696",
          manager: "13456789011",
          student: "13838411438"
        };
        this.form.phone = phones[type] || phones.student;
        this.form.password = "123456";
        this.errors = {};
      },
      notify(message, type) {
        this.message = message;
        this.messageType = type || "info";
      },
      goRedirect() {
        const params = new URLSearchParams(location.search);
        const redirect = params.get("redirect") || "/campus/";
        location.href = redirect.startsWith("/") && !redirect.startsWith("//") ? redirect : "/campus/";
      }
    }
  });
</script>
</body>
</html>
