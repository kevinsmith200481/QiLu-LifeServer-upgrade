server.port=9091
rpc.name=qilu-ai-service
rpc.serverHost=localhost
rpc.serverPort=8091
rpc.connectTimeoutMs=1000
rpc.requestTimeoutMs=3000
rpc.maxAttempts=3
rpc.retryIntervalMs=100
# Comma-separated Python Agent instances for knowledge reload broadcast and metrics aggregation.
# Environment variable AI_AGENT_BASE_URLS has higher priority.
ai.agent.base-urls=http://localhost:8001
ai.agent.connect-timeout-ms=1500
ai.agent.read-timeout-ms=${AI_AGENT_READ_TIMEOUT_MS:50000}
ai.agent.checkpoint-internal-token=${AI_CHECKPOINT_INTERNAL_TOKEN:}
ai.governance.rate-limit-per-minute=120
ai.governance.circuit-failure-threshold=5
ai.governance.circuit-open-millis=30000
# Optional estimated model prices. Keep zero by default unless a real billing model is configured.
ai.governance.input-price-per1k-tokens-usd=0
ai.governance.output-price-per1k-tokens-usd=0
